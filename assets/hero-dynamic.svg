<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220">
        <animate attributeName="stop-color" values="#0b1220;#0e1a1a;#0b1220" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#10241f">
        <animate attributeName="stop-color" values="#10241f;#1a2a18;#10241f" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a140c">
        <animate attributeName="stop-color" values="#1a140c;#20180f;#1a140c" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowTeal" cx="22%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="78%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <ellipse cx="260" cy="140" rx="260" ry="160" fill="url(#glowTeal)">
    <animate attributeName="cx" values="240;300;240" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="940" cy="260" rx="240" ry="150" fill="url(#glowAmber)">
    <animate attributeName="cx" values="920;980;920" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- moving light beams -->
  <g opacity="0.55">
    <rect x="-200" y="90" width="320" height="3" fill="url(#beam)" transform="rotate(18 100 90)">
      <animate attributeName="x" values="-200;1200" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-260" y="210" width="360" height="2" fill="url(#beam)" transform="rotate(-12 100 210)">
      <animate attributeName="x" values="-260;1200" dur="7.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="-180" y="320" width="280" height="2" fill="url(#beam)" transform="rotate(8 100 320)">
      <animate attributeName="x" values="-180;1200" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- orbiting dots -->
  <circle r="5" fill="#14b8a6">
    <animateMotion dur="9s" repeatCount="indefinite" path="M120,320 C300,80 700,40 1080,180"/>
  </circle>
  <circle r="4" fill="#f59e0b">
    <animateMotion dur="11s" repeatCount="indefinite" path="M80,100 C400,360 800,300 1120,120"/>
  </circle>

  <text x="80" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f8fafc" letter-spacing="-2">flower1201</text>
  <text x="84" y="220" font-family="Consolas, Menlo, monospace" font-size="22" fill="#5eead4">LOCAL-FIRST TOOLS FOR AI CODING</text>
  <text x="84" y="265" font-family="Consolas, Menlo, monospace" font-size="16" fill="#fbbf24">PixelProof  |  RetryScope  |  RepoDiagram</text>

  <g transform="translate(860,110)">
    <rect width="250" height="200" rx="18" fill="#0e1116" fill-opacity="0.55" stroke="#334155"/>
    <text x="24" y="42" font-family="Consolas, Menlo, monospace" font-size="14" fill="#94a3b8">&gt; offline mode</text>
    <text x="24" y="78" font-family="Consolas, Menlo, monospace" font-size="16" fill="#5eead4">no cloud upload</text>
    <text x="24" y="114" font-family="Consolas, Menlo, monospace" font-size="16" fill="#fbbf24">no API keys</text>
    <text x="24" y="150" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e2e8f0">MIT · pre-release</text>
    <rect x="24" y="172" width="12" height="18" fill="#14b8a6">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
