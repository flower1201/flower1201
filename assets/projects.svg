<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="open source projects">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0e1116"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="320" fill="#0b0f14"/>
  <text x="28" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e7e5e4">OPEN SOURCE · LOCAL FIRST</text>
  <text x="28" y="58" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#78716c">MIT · Pre-release · Built for AI coding workflows</text>

  <!-- PixelProof -->
  <g filter="url(#soft)">
    <rect x="28" y="80" width="270" height="210" rx="16" fill="url(#g1)" stroke="#2dd4bf55"/>
    <text x="48" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0fdfa">PixelProof</text>
    <text x="48" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#99f6e4">Visual diffs for AI UIs</text>
    <text x="48" y="180" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#ccfbf1">design.png  vs  screenshot</text>
    <text x="48" y="202" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#5eead4">’ offline HTML + agent checklist</text>
    <rect x="48" y="230" width="88" height="28" rx="8" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="62" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#f0fdfa">v0.1.0-rc.2</text>
  </g>

  <!-- RetryScope -->
  <g filter="url(#soft)">
    <rect x="315" y="80" width="270" height="210" rx="16" fill="url(#g2)" stroke="#fb923c55"/>
    <text x="335" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff7ed">RetryScope</text>
    <text x="335" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#fdba74">Where agents get stuck</text>
    <text x="335" y="180" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#ffedd5">Claude Code JSONL ’ RF findings</text>
    <text x="335" y="202" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#fdba74">’ timeline + evidence report</text>
    <rect x="335" y="230" width="88" height="28" rx="8" fill="#7c2d12" stroke="#fb923c"/>
    <text x="349" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff7ed">v0.1.0-rc.1</text>
  </g>

  <!-- RepoDiagram -->
  <g filter="url(#soft)">
    <rect x="602" y="80" width="270" height="210" rx="16" fill="url(#g3)" stroke="#38bdf855"/>
    <text x="622" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f9ff">RepoDiagram</text>
    <text x="622" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7dd3fc">Architecture without upload</text>
    <text x="622" y="180" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#e0f2fe">local tree ’ Mermaid map</text>
    <text x="622" y="202" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#7dd3fc">’ offline HTML · no LLM</text>
    <rect x="622" y="230" width="88" height="28" rx="8" fill="#0c4a6e" stroke="#38bdf8"/>
    <text x="636" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#f0f9ff">v0.1.0-rc.1</text>
  </g>
</svg>
